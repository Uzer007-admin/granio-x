name: Проверка исходников
on: [push, pull_request]
permissions:
  contents: read
env:
  GOWORK: "off"
jobs:
  vet:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['.']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Go vet
        working-directory: ${{ matrix.module }}
        run: go vet -tags migrated_fynedo,ci ./...
